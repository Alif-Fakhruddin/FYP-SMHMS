plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.example.smhms_mobile"
    compileSdkVersion 34

    compileOptions {
        // AI: Diaktifkan untuk menyokong flutter_local_notifications
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.example.smhms_mobile"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // AI: Diperlukan jika kaedah melebihi had 64K
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // AI: Pustaka desugaring yang diperlukan
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

// Paksa semua subproject/plugin luaran untuk guna compileSdkVersion 34
rootProject.subprojects {
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.exifinterface') {
                details.useVersion '1.3.6'
            }
        }
    }
    afterEvaluate { subproject ->
        if (subproject.hasProperty('android')) {
            subproject.android {
                compileSdkVersion 34
                if (namespace == null) {
                    namespace subproject.group
                }
            }
        }
    }
}